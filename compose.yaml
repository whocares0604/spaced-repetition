services:
  postgres:
    image: postgres:18
    container_name: spaced-repetition-db
    environment:
      POSTGRES_DB: ${DB_NAME:-spaced_repetition}
      POSTGRES_USER: ${DB_USER:-spaced}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spaced}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
